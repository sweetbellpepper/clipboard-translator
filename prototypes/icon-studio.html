<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>译雀 · 图标方案（供选择 · 未落地代码）</title>
<style>
  :root{
    --bg:#E7E3DA; --surface:#F1EDE5; --fg:#45413A; --muted:#857F72; --border:#D6CFC1;
    --accent:#7C8A6E; --accent2:#B08E88;
    --dbg:#1E2422; --dsurface:#262E2B; --dfg:#ECEAE3; --dmuted:#9AA39C; --dborder:#38423E;
    --daccent:#86B7A6; --daccent2:#C9A96A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;padding:28px 20px 60px}
  header{max-width:960px;margin:0 auto 22px}
  h1{font-size:22px;margin:0 0 6px}
  header p{margin:0;color:var(--muted)}
  .grid{max-width:960px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:18px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 18px 16px}
  .card h2{font-size:16px;margin:0 0 2px;display:flex;align-items:baseline;gap:8px}
  .card h2 .en{color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.06em}
  .card .why{margin:0 0 14px;color:var(--muted);font-size:12.5px}
  .row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .tile{border-radius:22%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .tile.big{width:112px;height:112px}
  .tile.light{background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
  .tile.dark{background:var(--dsurface);box-shadow:inset 0 0 0 1px var(--dborder)}
  .tile svg{width:72%;height:72%;display:block}
  .ladder{display:flex;align-items:flex-end;gap:10px}
  .ladder .tile{border-radius:22%}
  .ladder .tile svg{width:74%;height:74%}
  .lab{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}
  .col{display:flex;flex-direction:column;align-items:center}
  .s16{width:16px;height:16px}.s24{width:24px;height:24px}.s32{width:32px;height:32px}.s48{width:48px;height:48px}.s64{width:64px;height:64px}
  .note{max-width:960px;margin:20px auto 0;color:var(--muted);font-size:12.5px}
  svg{overflow:visible}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 麻雀剪影（栖枝·朝右）：尾/身/头/喙 单色 + 翅膀二色 -->
    <symbol id="bird" viewBox="0 0 64 64">
      <path fill="var(--ic1)" d="M24 44 L5 53 L23 48 Z"/>
      <path fill="var(--ic1)" d="M44 23 C36 21 26 25 22 32 C18 39 22 47 30 48 C38 49 45 44 45 36 C45 30 45 26 44 23 Z"/>
      <circle fill="var(--ic1)" cx="44" cy="16" r="7"/>
      <path fill="var(--ic1)" d="M51 13 L59 16 L51 19 Z"/>
      <path fill="var(--ic2)" d="M28 33 C34 31 39 35 37 40 C35 44 29 44 27 40 C26 37 26 34 28 33 Z"/>
    </symbol>
    <!-- 麻雀剪影·翅膀挖空（负空间） -->
    <symbol id="birdCut" viewBox="0 0 64 64">
      <path fill="var(--ic1)" d="M24 44 L5 53 L23 48 Z"/>
      <path fill="var(--ic1)" d="M44 23 C36 21 26 25 22 32 C18 39 22 47 30 48 C38 49 45 44 45 36 C45 30 45 26 44 23 Z"/>
      <circle fill="var(--ic1)" cx="44" cy="16" r="7"/>
      <path fill="var(--ic1)" d="M51 13 L59 16 L51 19 Z"/>
      <path fill="var(--cut)" d="M28 33 C34 31 39 35 37 40 C35 44 29 44 27 40 C26 37 26 34 28 33 Z"/>
    </symbol>

    <!-- A 雀影：实心剪影直接做图标 -->
    <symbol id="iconA" viewBox="0 0 64 64"><use href="#bird"/></symbol>

    <!-- B 折雀：折纸/低多边形飞鸟 -->
    <symbol id="iconB" viewBox="0 0 64 64">
      <path fill="var(--ic1)" d="M14 40 L40 22 L45 40 Z"/>
      <path fill="var(--ic2)" d="M40 22 L54 10 L47 32 Z"/>
      <path fill="var(--ic1)" d="M14 40 L6 52 L30 45 Z" opacity=".82"/>
      <path fill="var(--ic2)" d="M45 24 L58 27 L45 31 Z"/>
    </symbol>

    <!-- C 语窗：对话气泡 + 负空间麻雀 -->
    <symbol id="iconC" viewBox="0 0 64 64">
      <path fill="var(--ic1)" d="M12 10 H52 A8 8 0 0 1 60 18 V38 A8 8 0 0 1 52 46 H30 L18 56 V46 H12 A8 8 0 0 1 4 38 V18 A8 8 0 0 1 12 10 Z"/>
      <g transform="translate(9,7) scale(0.72)">
        <path fill="var(--cut)" d="M24 44 L5 53 L23 48 Z"/>
        <path fill="var(--cut)" d="M44 23 C36 21 26 25 22 32 C18 39 22 47 30 48 C38 49 45 44 45 36 C45 30 45 26 44 23 Z"/>
        <circle fill="var(--cut)" cx="44" cy="16" r="7"/>
        <path fill="var(--cut)" d="M51 13 L59 16 L51 19 Z"/>
      </g>
    </symbol>

    <!-- D 翼书：S 形双翼笔触 -->
    <symbol id="iconD" viewBox="0 0 64 64">
      <path fill="none" stroke="var(--ic1)" stroke-width="9" stroke-linecap="round" d="M14 20 C30 8 44 16 36 28 C28 40 40 50 52 42"/>
      <path fill="none" stroke="var(--ic2)" stroke-width="5" stroke-linecap="round" d="M20 44 C26 50 34 52 42 50" opacity=".9"/>
    </symbol>

    <!-- E 笺雀：剪贴板 + 栖雀 -->
    <symbol id="iconE" viewBox="0 0 64 64">
      <rect x="14" y="12" width="34" height="44" rx="7" fill="none" stroke="var(--ic1)" stroke-width="4.5"/>
      <rect x="24" y="6" width="14" height="10" rx="4" fill="var(--ic1)"/>
      <path fill="none" stroke="var(--ic1)" stroke-width="3.5" stroke-linecap="round" d="M22 30 H40 M22 38 H40 M22 46 H33"/>
      <g transform="translate(30,-2) scale(0.5)">
        <path fill="var(--ic2)" d="M24 44 L5 53 L23 48 Z"/>
        <path fill="var(--ic2)" d="M44 23 C36 21 26 25 22 32 C18 39 22 47 30 48 C38 49 45 44 45 36 C45 30 45 26 44 23 Z"/>
        <circle fill="var(--ic2)" cx="44" cy="16" r="7"/>
        <path fill="var(--ic2)" d="M51 13 L59 16 L51 19 Z"/>
      </g>
    </symbol>

    <!-- F 圆雀：圆环徽章 + 剪影 -->
    <symbol id="iconF" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="27" fill="none" stroke="var(--ic1)" stroke-width="4.5"/>
      <g transform="translate(8,8) scale(0.75)"><use href="#birdCut"/></g>
    </symbol>
  </defs>
</svg>

<header>
  <h1>译雀 / Sparrow · 图标方案</h1>
  <p>六款候选，均为矢量（SVG），可无损导出 16–256px 与 .ico。左＝浅色（雾隐）底，右＝深色（墨玉）底；下方为 16/24/32/48/64px 真实尺寸梯，检验小尺寸辨识度。<b>仅供选择，未改任何代码/图标。</b></p>
</header>

<div class="grid" id="grid"></div>

<p class="note">说明：图标主色取当前配色的强调色（浅=雾隐 #7C8A6E，深=墨玉 #86B7A6），副色取 accent-2；落地时可固定为一套品牌色或随配色联动。选定后我再导出 PNG/ICO 并替换 src-tauri/icons。</p>

<script>
const CONCEPTS=[
 {id:"iconA",cn:"雀影",en:"Perch",why:"实心麻雀剪影＋二色翅膀。最简、最耐缩小，16px 仍是一只鸟；品牌感强。"},
 {id:"iconB",cn:"折雀",en:"Origami",why:"折纸/低多边形飞鸟，双色调面块。几何现代感，呼应「轻量」；小尺寸略损细节。"},
 {id:"iconC",cn:"语窗",en:"Bubble",why:"对话气泡（翻译）内挖空麻雀负空间。一眼「翻译＋雀」；气泡轮廓在小尺寸清晰。"},
 {id:"iconD",cn:"翼书",en:"Wing S",why:"S（Sparrow）形双翼笔触，抽象写意。最「logo」化、高级感；但鸟意象较弱。"},
 {id:"iconE",cn:"笺雀",en:"Clipboard",why:"剪贴板线框＋栖雀，直白点题「剪贴板翻译」。信息最全；16px 偏挤。"},
 {id:"iconF",cn:"圆雀",en:"Roundel",why:"圆环徽章＋挖空剪影，圆形徽章感。稳重耐看；环＋鸟双层小尺寸稍糊。"},
];
const L=[16,24,32,48,64];
function tile(id,mode,size){
  const light=mode==="light";
  const vars=light?`--ic1:#7C8A6E;--ic2:#B08E88;--cut:#F1EDE5`:`--ic1:#86B7A6;--ic2:#C9A96A;--cut:#262E2B`;
  const cls=size?`tile ${mode} s${size}`:`tile ${mode} big`;
  return `<div class="${cls}" style="${vars}"><svg viewBox="0 0 64 64"><use href="#${id}"/></svg></div>`;
}
document.getElementById("grid").innerHTML=CONCEPTS.map((c,i)=>`
 <section class="card">
   <h2>方案 ${"ABCDEF"[i]} · ${c.cn}<span class="en">${c.en}</span></h2>
   <p class="why">${c.why}</p>
   <div class="row">
     <div class="col">${tile(c.id,"light")}<div class="lab">浅色 · 雾隐</div></div>
     <div class="col">${tile(c.id,"dark")}<div class="lab">深色 · 墨玉</div></div>
     <div class="col"><div class="ladder">${L.map(s=>tile(c.id,"light",s)).join("")}</div><div class="lab">16 / 24 / 32 / 48 / 64 px（浅）</div></div>
     <div class="col"><div class="ladder">${L.map(s=>tile(c.id,"dark",s)).join("")}</div><div class="lab">16 / 24 / 32 / 48 / 64 px（深）</div></div>
   </div>
 </section>`).join("");
</script>
</body>
</html>
